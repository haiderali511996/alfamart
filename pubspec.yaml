name: alfamart_cashflow
description: "Alfa Mart Cash Flow – offline-first accounts app for counters, cashiers, purchases and expenses."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8
  uuid: ^4.6.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  fl_chart: ^1.3.0
  archive: ^4.5.2
  share_plus: ^13.3.1
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#011E65"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 24

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#011D5E"
  image: assets/images/splash_logo.png
  android_12:
    color: "#011D5E"
    image: assets/images/splash_android12.png
    icon_background_color: "#011D5E"
  web: false
